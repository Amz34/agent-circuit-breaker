<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="45%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Glowing Cyber Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.35"/>
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" opacity="0.4"/>
    </pattern>

    <!-- Dynamic Neon Circuit Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Breaker Spark Energy Gradient -->
    <linearGradient id="breakerEnergy" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
    </filter>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="180" r="120" fill="#6366f1" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="240" cy="140" r="80" fill="#38bdf8" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="1080" cy="100" r="150" fill="#ec4899" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Bespoke Engineering Icon: Kinetic Circuit Interrupter + Quantum Knot -->
  <g transform="translate(60, 50)">
    <!-- Outer Kinetic Octagon Frame -->
    <polygon points="130,20 200,20 250,70 250,190 200,240 130,240 80,190 80,70" 
             fill="#0b1120" stroke="url(#neonCyan)" stroke-width="3" opacity="0.9" filter="url(#cyanGlow)"/>
    
    <!-- Geometric Interrupter Rings -->
    <circle cx="165" cy="130" r="75" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="165" cy="130" r="58" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

    <!-- High-Voltage Interrupted Arc Geometry -->
    <path d="M 125 130 L 150 130 L 140 100 L 175 145 L 155 145 L 168 175 Z" 
          fill="url(#breakerEnergy)" filter="url(#cyanGlow)"/>

    <!-- Kinetic Terminal Nodes -->
    <circle cx="80" cy="130" r="6" fill="#38bdf8" filter="url(#cyanGlow)"/>
    <circle cx="250" cy="130" r="6" fill="#10b981" filter="url(#cyanGlow)"/>
    <circle cx="165" cy="20" r="5" fill="#6366f1"/>
    <circle cx="165" cy="240" r="5" fill="#ef4444"/>

    <!-- Dynamic Trace Lines -->
    <line x1="86" y1="130" x2="107" y2="130" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="223" y1="130" x2="244" y2="130" stroke="#10b981" stroke-width="2.5"/>
  </g>

  <!-- Typography Hierarchy -->
  <!-- Top Spec Tag -->
  <g transform="translate(360, 85)">
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">REKIT // SAFETY GATE</text>
  </g>

  <!-- Brand Wordmark -->
  <text x="360" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1.2">
    Agent Circuit Breaker
  </text>

  <!-- Mission Statement & Value Proposition -->
  <text x="360" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#94a3b8" letter-spacing="-0.2">
    Zero-overhead, microsecond-deterministic tripwire for recursive agent runaways.
  </text>

  <!-- High-Pitch Feature Capability Pills -->
  <g transform="translate(360, 235)">
    <!-- Pill 1: Latency -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="155" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#38bdf8"/>
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#f8fafc">&lt; 15µs IN-MEMORY</text>
    </g>

    <!-- Pill 2: Dependency -->
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#10b981"/>
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#f8fafc">ZERO DEPENDENCIES</text>
    </g>

    <!-- Pill 3: Invariants -->
    <g transform="translate(345, 0)">
      <rect x="0" y="0" width="175" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#f59e0b"/>
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#f8fafc">FINANCIAL CEILING TRIP</text>
    </g>

    <!-- Pill 4: License & Proof -->
    <g transform="translate(535, 0)">
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#c084fc"/>
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="700" fill="#f8fafc">GITLEAKS SHIELDED</text>
    </g>
  </g>

  <!-- Tech Authority Accent Mark -->
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#neonCyan)" stroke-width="4"/>
</svg>
